<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>

<body>

<script>
    let a = "utkarsh";
    let result = "";

    for (let i = 0; i < a.length; i++) {
        result += a[i].toUpperCase();
    }

    document.write(result);
</script>

</body>
</html>
